[workspace]
resolver = "2"
members = [
    "crates/besedka-core",
    "crates/besedka-infra",
    "crates/besedka-app",
]

[workspace.package]
edition = "2021"
rust-version = "1.92"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# Shared dependencies pinned here; member crates use `workspace = true`.
# Versions mirror the proven stack of the trackly reference (see CONVENTIONS.md).
[workspace.dependencies]
# Domain / shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argon2 = "0.5"
# Enables `SaltString::generate(&mut OsRng)` (rand_core/getrandom). Feature
# unifies with the copy of password-hash that argon2 already depends on.
password-hash = { version = "0.5", features = ["getrandom"] }

# Purely-async trait objects (`dyn AdClient`, `dyn AdDirectory`) — ports only.
async-trait = "0.1"

# I/O adapters (infra)
rusqlite = { version = "0.38", features = ["bundled"] }
refinery = { version = "0.9", features = ["rusqlite-bundled"] }
# AD/Kerberos (ported from trackly, same pins). `sspi` with default-features
# off drops the aws-lc-rs C-crypto TLS provider (only needed for the unused
# `network_client` path) — the acceptor decrypts service tickets offline.
sspi = { version = "0.21", default-features = false }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
hickory-resolver = "0.26.1"

# HTTP server (app)
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "macros", "ws", "query"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tower-sessions = "0.15"
time = "0.3"
# base64 for the `Negotiate <token>` Authorization header payloads.
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "fs", "net", "time"] }
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Test helpers
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Convention (trackly): explicit deny, keep the lists per-crate as we grow them.
disallowed_methods = "deny"
disallowed_types = "deny"
