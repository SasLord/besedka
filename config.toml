# Besedka server config (no secrets here — see .gitignore).
# Env overrides: BESEDKA_HOST, BESEDKA_PORT, BESEDKA_DB_PATH, BESEDKA_CONFIG,
# plus BESEDKA_AD_* (see docs/AD-SETUP.md).

[server]
host = "127.0.0.1"
port = 8080

[database]
# SQLite file, relative to the working directory (created if missing).
path = "data/besedka.db"

[sessions]
cookie_name = "besedka_session"
# Session lifetime, seconds (7 days).
session_ttl_secs = 604800

# ── Active Directory / Kerberos SSO (Wave 1.2) ──────────────────────────────
# Local dev defaults: AD ON in MOCK mode — no domain controller, no keytab,
# no Kerberos ticket needed. Fixtures live in besedka-infra/src/ad/mock.rs:
#   us100 / Passw0rd!   (manager)   us200 / Secret123 (user)   us300 (admin)
# Try it:  curl -i 'http://127.0.0.1:8080/api/v1/auth_ad_sso'        # -> 200 + session cookie
#          curl -i 'http://127.0.0.1:8080/api/v1/auth_ad_sso?login=us300'
# Production: set mock = false and fill in spn / keytab_path / host / base_dn
# (see docs/AD-SETUP.md). The service-account password is env-only:
# BESEDKA_AD_BIND_PASSWORD.
[ad]
enabled = true
mock = true
domain = "example.local"
# SPN the keytab was generated for (ktpass … /crypto AES256-SHA1):
# spn = "HTTP/chat.example.local"
# keytab_path = "secrets/HTTP-chat.keytab"   # *.keytab is gitignored
# host = "dc1.example.local"
# base_dn = "dc=example,dc=local"
# bind_dn = "svc-besedka-ro@example.local"
name_attr = "displayName"
# AD group -> Besedka role (admin > manager > user, highest wins):
# [[ad.role_mapping]]
# group_dn = "CN=Besedka-Admins,OU=Groups,DC=example,DC=local"
# role = "admin"
# [[ad.role_mapping]]
# group_dn = "CN=Besedka-Managers,OU=Groups,DC=example,DC=local"
# role = "manager"
