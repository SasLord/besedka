[package]
name = "besedka-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Never goes to crates.io — this is a workspace-internal crate.
publish = false
description = "Besedka composition root: axum HTTP server, config, wiring (Tauri later)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "besedka"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
besedka-core = { path = "../besedka-core" }
besedka-infra = { path = "../besedka-infra" }
axum = { workspace = true }
tower-http = { workspace = true }
tower-sessions = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# tower "util" (ServiceExt::oneshot) comes from the workspace pin.
tower = { workspace = true }
